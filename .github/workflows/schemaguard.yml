name: SchemaGuard

on:
  pull_request:
    paths:
      - "db/migration/**"
      - ".schemaguard/**"
      - "schemaguard/**"

permissions:
  contents: read
  security-events: write # Required for uploading SARIF reports

jobs:
  schema-safety:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Run SchemaGuard Analysis
        run: |
          mvn clean package -DskipTests
          java -jar schemaguard-cli/target/schemaguard-cli-1.0-SNAPSHOT.jar check \
            --base-dir examples/sample-company/baseline-migrations \
            --candidate-dir examples/sample-company/unsafe-candidate \
            --policy .schemaguard/policy.yaml \
            --contracts examples/sample-company/.schemaguard/service-contracts.yaml

      - name: Upload SARIF Report to GitHub Code Scanning
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: .schemaguard/runs/latest/report.sarif