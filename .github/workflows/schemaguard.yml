name: SchemaGuard CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  schema-safety:
    name: Schema Migration Safety Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build and Run Regression Test Suite
        run: mvn -B clean package

      - name: Verify Safe Migration Passes (Expected Exit Code 0)
        run: |
          chmod +x ./schemaguard.sh
          ./schemaguard.sh check \
            --run-id ci-safe-check \
            --base origin/${{ github.base_ref || 'main' }} \
            --head ${{ github.sha }} \
            --base-dir examples/sample-company/baseline-migrations \
            --candidate-dir examples/sample-company/safe-candidate \
            --policy test-fixtures/sample-contracts/policy.yaml \
            --contracts test-fixtures/sample-contracts/service-contracts.yaml

      - name: Verify Unsafe Migration Blocks (Expected Exit Code 1)
        run: |
          set +e
          ./schemaguard.sh check \
            --run-id ci-unsafe-check \
            --base origin/${{ github.base_ref || 'main' }} \
            --head ${{ github.sha }} \
            --base-dir examples/sample-company/baseline-migrations \
            --candidate-dir examples/sample-company/unsafe-candidate \
            --policy test-fixtures/sample-contracts/policy.yaml \
            --contracts test-fixtures/sample-contracts/service-contracts.yaml
          EXIT_CODE=$?
          set -e
          if [ $EXIT_CODE -ne 1 ]; then
            echo "Expected unsafe migration to fail with exit code 1, but got $EXIT_CODE"
            exit 1
          fi
          echo "SchemaGuard correctly blocked unsafe candidate with exit code 1."

      - name: Upload Analysis Reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: schemaguard-reports
          path: .schemaguard/runs/
          if-no-files-found: warn

      - name: Upload SARIF Report to GitHub Code Scanning
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        continue-on-error: true
        with:
          sarif_file: .schemaguard/runs/ci-unsafe-check/report.sarif
          category: schemaguard
