name: SchemaGuard CI

on:
  push:
    branches:
      - main
      - master
  pull_request:

permissions:
  contents: read

jobs:
  schema-safety:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build and Run Regression Test Suite
        run: mvn -B clean package

      - name: Verify Safe Migration Passes (Expected Exit Code 0)
        run: |
          java -jar schemaguard-cli/target/schemaguard-cli-1.0-SNAPSHOT.jar check \
            --run-id ci-safe-check \
            --base origin/${{ github.base_ref || 'main' }} \
            --head ${{ github.sha }} \
            --base-dir examples/sample-company/baseline-migrations \
            --candidate-dir examples/sample-company/safe-candidate \
            --contracts test-fixtures/sample-contracts/service-contracts.yaml \
            --policy test-fixtures/sample-contracts/policy.yaml

      - name: Verify Unsafe Migration Blocks (Expected Exit Code 1)
        run: |
          set +e
          java -jar schemaguard-cli/target/schemaguard-cli-1.0-SNAPSHOT.jar check \
            --run-id ci-unsafe-check \
            --base origin/${{ github.base_ref || 'main' }} \
            --head ${{ github.sha }} \
            --base-dir examples/sample-company/baseline-migrations \
            --candidate-dir examples/sample-company/unsafe-candidate \
            --contracts test-fixtures/sample-contracts/service-contracts.yaml \
            --policy test-fixtures/sample-contracts/policy.yaml
          EXIT_CODE=$?
          set -e
          if [ $EXIT_CODE -ne 1 ]; then
            echo "Expected unsafe migration to fail with exit code 1, but got $EXIT_CODE"
            exit 1
          fi
          echo "Unsafe migration correctly blocked with exit code 1."